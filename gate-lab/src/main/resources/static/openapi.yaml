openapi: 3.0.3
info:
  title: GATE gate-lab (intentionally vulnerable practice API)
  version: 0.1.0
  description: |
    LOCAL PRACTICE ONLY. Do not expose. The same API is served by two profiles:
    vulnerable (127.0.0.1:8081) and fixed (127.0.0.1:8082).
    This document is kept in sync with the controllers by OpenApiContractTest.
servers:
  - url: http://127.0.0.1:8081
    description: vulnerable
  - url: http://127.0.0.1:8082
    description: fixed
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Log in and get a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        "401": { description: Invalid credentials }

  /api/me:
    get:
      operationId: me
      summary: Current user
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { description: Not authenticated }

  /api/orders:
    get:
      operationId: listMyOrders
      summary: Orders of the current user
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        "401": { description: Not authenticated }
    post:
      operationId: createOrder
      summary: Create an order for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "400": { description: Invalid order }
        "401": { description: Not authenticated }

  /api/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getOrder
      summary: One order (owned by the caller)
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "401": { description: Not authenticated }
        "404": { description: Not found or not owned by the caller }
    put:
      operationId: updateOrder
      summary: Update quantity, note and shipping address of an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdate' }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "400": { description: Invalid order }
        "401": { description: Not authenticated }
        "404": { description: Not found or not owned by the caller }
    delete:
      operationId: deleteOrder
      summary: Delete an order
      responses:
        "204": { description: Deleted }
        "401": { description: Not authenticated }
        "404": { description: Not found or not owned by the caller }

  /api/products/search:
    get:
      operationId: searchProducts
      summary: Search visible products by name (case-insensitive, substring)
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        "400": { description: Invalid query }

  /api/assistant/order-search:
    post:
      operationId: assistantOrderSearch
      summary: Order assistant - search my orders in natural language (AI writes SQL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantQuestion' }
      responses:
        "200": { description: Matching orders }
        "401": { description: Not authenticated }
        "422": { description: AI output blocked by the gate (fixed variant) }

  /api/assistant/review-summary:
    post:
      operationId: assistantReviewSummary
      summary: Order assistant - summarize product reviews as HTML (AI output shown in the page)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantReviewRequest' }
      responses:
        "200": { description: HTML summary }
        "401": { description: Not authenticated }
        "404": { description: Product not found }

  /api/assistant/order-action:
    post:
      operationId: assistantOrderAction
      summary: Order assistant - act on my orders (AI chooses the action)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantRequest' }
      responses:
        "200": { description: Action result }
        "401": { description: Not authenticated }
        "422": { description: AI output blocked by the gate (fixed variant) }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { type: string }
    OrderRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, format: int64, example: 1 }
        quantity: { type: integer, minimum: 1, maximum: 100, example: 1 }
        note: { type: string, maxLength: 500, example: "leave at the door" }
        shippingAddress: { type: string, maxLength: 300, example: "Seoul, Example-ro 1" }
    OrderUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 100, example: 2 }
        note: { type: string, maxLength: 500, example: "changed" }
        shippingAddress: { type: string, maxLength: 300, example: "Seoul, Example-ro 2" }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        owner: { type: string }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer }
        note: { type: string }
        shippingAddress: { type: string }
        createdAt: { type: string, format: date-time }
    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        price: { type: integer }
    AssistantQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500, example: "Show my orders with quantity over 1" }
    AssistantReviewRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: integer, format: int64, example: 1 }
    AssistantRequest:
      type: object
      required: [request]
      properties:
        request: { type: string, maxLength: 500, example: "cancel order 1" }
