# gate-lab: 일부러 취약한 실습용 앱. 루프백 주소에서만 띄운다 (LabSafetyGuard가 확인).
server:
  address: 127.0.0.1

spring:
  application:
    name: gate-lab
  datasource:
    # 메모리 DB: 띄울 때마다 초기화된다. 운영 DB(gate-server)와 완전히 분리
    # 띄울 때마다 새 이름의 DB (같은 JVM에서 여러 번 띄워도 섞이지 않게)
    url: jdbc:h2:mem:gatelab-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: lab
    password: ""
  sql:
    init:
      mode: never   # 스키마·시드는 LabDataInitializer가 직접 만든다 (무작위 데모 비밀번호 때문)

# GATE_LAB_ACK, GATE_LAB_JWT_SECRET, GATE_LAB_DEMO_PASSWORD 환경 변수로 지정한다
gate:
  lab:
    ack: ${GATE_LAB_ACK:}
    jwt-secret: ${GATE_LAB_JWT_SECRET:}
    demo-password: ${GATE_LAB_DEMO_PASSWORD:}
    in-container: ${GATE_LAB_IN_CONTAINER:false}

---
spring:
  config:
    activate:
      on-profile: vulnerable
server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: fixed
server:
  port: 8082
