<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', Roboto, sans-serif">
  <rect width="1100" height="250" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Roadmap · 진행 단계</text>
  <text x="1060" y="42" font-size="13" fill="#64748b" text-anchor="end">one stage at a time · 한 번에 한 단계</text>

  <line x1="100" y1="120" x2="1000" y2="120" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="100" y1="120" x2="160" y2="120" stroke="#16a34a" stroke-width="4"/>

  <g text-anchor="middle">
    <circle cx="100" cy="120" r="18" fill="#16a34a"/>
    <text x="100" y="126" font-size="15" font-weight="700" fill="#ffffff">0</text>
    <text x="100" y="166" font-size="14" font-weight="700" fill="#0f172a">Skeleton</text>
    <text x="100" y="186" font-size="13" fill="#475569">뼈대</text>
    <text x="100" y="206" font-size="12" fill="#16a34a" font-weight="700">IN PROGRESS</text>

    <circle cx="250" cy="120" r="18" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="250" y="126" font-size="15" font-weight="700" fill="#b91c1c">1</text>
    <text x="250" y="166" font-size="14" font-weight="700" fill="#0f172a">gate-pkg</text>
    <text x="250" y="186" font-size="13" fill="#475569">패키지 설치 검문소</text>
    <text x="250" y="206" font-size="12" fill="#64748b">3–4 wks</text>

    <circle cx="400" cy="120" r="18" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="400" y="126" font-size="15" font-weight="700" fill="#b91c1c">2</text>
    <text x="400" y="166" font-size="14" font-weight="700" fill="#0f172a">gate-lab</text>
    <text x="400" y="186" font-size="13" fill="#475569">취약점 실습장</text>
    <text x="400" y="206" font-size="12" fill="#64748b">2 wks</text>

    <circle cx="550" cy="120" r="18" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="550" y="126" font-size="15" font-weight="700" fill="#b91c1c">3</text>
    <text x="550" y="166" font-size="14" font-weight="700" fill="#0f172a">gate-authz</text>
    <text x="550" y="186" font-size="13" fill="#475569">권한 검사 자동 테스트</text>
    <text x="550" y="206" font-size="12" fill="#64748b">3 wks</text>

    <circle cx="700" cy="120" r="18" fill="#ffffff" stroke="#c2410c" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="700" y="126" font-size="15" font-weight="700" fill="#c2410c">4</text>
    <text x="700" y="166" font-size="14" font-weight="700" fill="#0f172a">gate-review</text>
    <text x="700" y="186" font-size="13" fill="#475569">AI 보안 코드 리뷰어</text>
    <text x="700" y="206" font-size="12" fill="#64748b">optional</text>

    <circle cx="850" cy="120" r="18" fill="#ffffff" stroke="#c2410c" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="850" y="126" font-size="15" font-weight="700" fill="#c2410c">5</text>
    <text x="850" y="166" font-size="14" font-weight="700" fill="#0f172a">gate-prompt</text>
    <text x="850" y="186" font-size="13" fill="#475569">프롬프트 인젝션 관문</text>
    <text x="850" y="206" font-size="12" fill="#64748b">optional</text>

    <circle cx="1000" cy="120" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="1000" y="126" font-size="15" font-weight="700" fill="#1d4ed8">★</text>
    <text x="1000" y="166" font-size="14" font-weight="700" fill="#0f172a">Dashboard</text>
    <text x="1000" y="186" font-size="13" fill="#475569">대시보드 · 데모</text>
    <text x="1000" y="206" font-size="12" fill="#64748b">final</text>
  </g>

  <rect x="190" y="70" width="420" height="26" rx="13" fill="#fef2f2"/>
  <text x="400" y="88" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Stages 0–3 = complete product · 여기까지만 해도 완성품</text>
</svg>
