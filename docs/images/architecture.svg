<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">GATE — Guard for AI-assisted Toolchain &amp; Endpoints</text>
  <text x="40" y="76" font-size="15" fill="#475569">A security checkpoint at every step from code to deployment · 코드가 만들어지고 배포되기까지의 길목마다 보안 검문소</text>

  <!-- Dev flow lane -->
  <rect x="40" y="104" width="1120" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="128" font-size="13" font-weight="600" fill="#64748b">DEVELOPMENT FLOW · 개발 흐름</text>

  <g font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="60" y="138" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="155" y="166">AI coding tool</text>
    <rect x="300" y="138" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="395" y="166">Install package</text>
    <rect x="540" y="138" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="635" y="166">Open Pull Request</text>
    <rect x="780" y="138" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="875" y="166">Deploy API</text>
    <rect x="1000" y="138" width="140" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1070" y="166">AI feature</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="250" y1="160" x2="296" y2="160"/>
    <line x1="490" y1="160" x2="536" y2="160"/>
    <line x1="730" y1="160" x2="776" y2="160"/>
    <line x1="970" y1="160" x2="996" y2="160"/>
  </g>

  <!-- Gates -->
  <g stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)">
    <line x1="395" y1="226" x2="395" y2="186"/>
    <line x1="635" y1="226" x2="635" y2="186"/>
    <line x1="875" y1="226" x2="875" y2="186"/>
    <line x1="1070" y1="226" x2="1070" y2="186"/>
  </g>

  <g>
    <rect x="300" y="230" width="190" height="112" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="316" y="258" font-size="16" font-weight="700" fill="#991b1b">① gate-pkg</text>
    <text x="316" y="280" font-size="13" fill="#334155">Package install checkpoint</text>
    <text x="316" y="299" font-size="13" fill="#334155">패키지 설치 검문소</text>
    <text x="316" y="326" font-size="12" fill="#64748b">Stage 1 · CLI → Hook → Action</text>

    <rect x="540" y="230" width="190" height="112" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="556" y="258" font-size="16" font-weight="700" fill="#9a3412">② gate-review</text>
    <text x="556" y="280" font-size="13" fill="#334155">AI security code reviewer</text>
    <text x="556" y="299" font-size="13" fill="#334155">AI 보안 코드 리뷰어</text>
    <text x="556" y="326" font-size="12" fill="#64748b">Stage 4 · optional</text>

    <rect x="780" y="230" width="190" height="112" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="796" y="258" font-size="16" font-weight="700" fill="#991b1b">③ gate-authz</text>
    <text x="796" y="280" font-size="13" fill="#334155">Authorization test (IDOR)</text>
    <text x="796" y="299" font-size="13" fill="#334155">권한 검사 자동 테스트</text>
    <text x="796" y="326" font-size="12" fill="#64748b">Stage 3 · OpenAPI driven</text>

    <rect x="1000" y="230" width="160" height="112" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1012" y="258" font-size="16" font-weight="700" fill="#9a3412">④ gate-prompt</text>
    <text x="1012" y="280" font-size="13" fill="#334155">Prompt-injection gate</text>
    <text x="1012" y="299" font-size="13" fill="#334155">프롬프트 인젝션 관문</text>
    <!-- keep inside box: 160px wide -->

    <text x="1012" y="326" font-size="12" fill="#64748b">Stage 5 · optional</text>
  </g>

  <!-- Lab -->
  <rect x="40" y="230" width="210" height="112" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="56" y="258" font-size="16" font-weight="700" fill="#854d0e">⑤ gate-lab</text>
  <text x="56" y="280" font-size="13" fill="#334155">Intentionally vulnerable app</text>
  <text x="56" y="299" font-size="13" fill="#334155">취약점 실습장 · target of ②③④</text>
  <text x="56" y="326" font-size="12" fill="#a16207" font-weight="600">Stage 2 · LOCAL ONLY</text>

  <!-- Results arrows -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="395" y1="342" x2="520" y2="430"/>
    <line x1="635" y1="342" x2="600" y2="430"/>
    <line x1="875" y1="342" x2="680" y2="430"/>
    <line x1="1070" y1="342" x2="700" y2="440"/>
  </g>
  <text x="60" y="400" font-size="13" fill="#475569">every gate stores findings ↘ · 모든 관문은 검사 결과를 저장</text>

  <!-- Platform -->
  <rect x="40" y="434" width="1120" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="462" font-size="13" font-weight="600" fill="#1d4ed8">SHARED PLATFORM · 공통 기반 (Stage 0 ✔)</text>

  <rect x="60" y="478" width="280" height="122" rx="10" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="76" y="506" font-size="16" font-weight="700" fill="#1e3a8a">gate-common</text>
  <text x="76" y="530" font-size="13" fill="#334155">Finding model (Java 17)</text>
  <text x="76" y="550" font-size="13" fill="#334155">공통 검사 결과 모델</text>
  <text x="76" y="578" font-size="12" fill="#64748b">what · where · severity · evidence · time</text>

  <rect x="370" y="478" width="300" height="122" rx="10" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="386" y="506" font-size="16" font-weight="700" fill="#1e3a8a">gate-server</text>
  <text x="386" y="530" font-size="13" fill="#334155">Spring Boot 4.1 · results API</text>
  <text x="386" y="550" font-size="13" fill="#334155">검사 결과 저장소 · 헬스체크</text>
  <text x="386" y="578" font-size="12" fill="#64748b">GET /actuator/health</text>

  <rect x="700" y="478" width="200" height="54" rx="10" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="716" y="502" font-size="15" font-weight="700" fill="#1e3a8a">PostgreSQL 18</text>
  <text x="716" y="521" font-size="12" fill="#64748b">scan_run · finding</text>

  <rect x="700" y="546" width="200" height="54" rx="10" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="716" y="570" font-size="15" font-weight="700" fill="#1e3a8a">Redis 8</text>
  <text x="716" y="589" font-size="12" fill="#64748b">external API cache</text>

  <rect x="930" y="478" width="210" height="122" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-dasharray="6 4"/>
  <text x="946" y="506" font-size="16" font-weight="700" fill="#1e3a8a">dashboard</text>
  <text x="946" y="530" font-size="13" fill="#334155">React + Vite (TS)</text>
  <text x="946" y="550" font-size="13" fill="#334155">통합 결과 화면</text>
  <text x="946" y="578" font-size="12" fill="#64748b">Final stage</text>

  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="670" y1="505" x2="696" y2="505"/>
    <line x1="670" y1="573" x2="696" y2="573"/>
    <line x1="340" y1="539" x2="366" y2="539"/>
  </g>
  <line x1="926" y1="539" x2="904" y2="539" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g font-size="12" fill="#475569">
    <rect x="40" y="636" width="22" height="12" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="70" y="647">core (stages 0–3) · 필수</text>
    <rect x="250" y="636" width="22" height="12" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="280" y="647">optional / planned · 선택·예정</text>
  </g>
</svg>
