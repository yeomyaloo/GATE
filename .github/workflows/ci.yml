# GATE CI: 빌드·테스트 + 0단계 완료 기준(docker compose 헬스체크) 검증
# 모든 Action은 커밋 SHA로 고정한다 (태그는 주석으로 표기).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (incl. Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build --no-daemon

      # 실패한 테스트 메시지를 Actions 주석(annotation)으로 남겨 PR·실행 화면에서 바로 보이게 한다
      - name: Report test failures as annotations
        if: failure()
        run: |
          for f in $(grep -l -E '<(failure|error)' */build/test-results/test/*.xml 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for tag in ("failure", "error"):
                  for el in case.findall(tag):
                      text = ((el.get("message") or "") + "\n" + (el.text or ""))[:3000]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
          done

      # 러너에는 Docker가 있으므로 통합 테스트가 건너뛰어지면 안 된다
      - name: Ensure integration tests actually ran
        run: |
          f=gate-server/build/test-results/test/TEST-io.gate.server.HealthCheckIT.xml
          grep -o '<testsuite [^>]*>' "$f"
          grep -q 'skipped="0"' "$f" || { echo "HealthCheckIT was skipped"; exit 1; }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  compose-smoke:
    name: Stage 0 check - docker compose health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^GATE_DB_PASSWORD=.*/GATE_DB_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: docker compose up (wait for healthy)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health check
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/actuator/health)
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
          echo "$body" | grep -q '"db":{"status":"UP"'
          echo "$body" | grep -q '"redis":{"status":"UP"'

      - name: Schema created by Flyway
        run: |
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT table_name FROM information_schema.tables WHERE table_schema = '"'"'public'"'"' ORDER BY 1"' | tee tables.txt
          grep -qx scan_run tables.txt
          grep -qx finding tables.txt

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
