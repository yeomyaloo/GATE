# GATE CI: 빌드·테스트 + 0단계 완료 기준(docker compose 헬스체크) 검증
# 모든 Action은 커밋 SHA로 고정한다 (태그는 주석으로 표기).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 매주 월요일: 실제 레지스트리 응답 형식이 녹화본과 어긋나지 않았는지 확인 (live 테스트)
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (incl. Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build --no-daemon

      # 실패한 테스트 메시지를 Actions 주석(annotation)으로 남겨 PR·실행 화면에서 바로 보이게 한다
      - name: Report test failures as annotations
        if: failure()
        run: |
          for f in $(grep -l -E '<(failure|error)' */build/test-results/test/*.xml 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for tag in ("failure", "error"):
                  for el in case.findall(tag):
                      body = el.text or ""
                      causes = [l.strip() for l in body.splitlines() if l.strip().startswith("Caused by")]
                      text = ((el.get("message") or "")[:1500] + "\n" + "\n".join(causes[-4:]))[:3500]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
          done

      # 훅 래퍼 계약: 설치가 아닌 명령은 출력 없음, jar가 없으면 통과가 아니라 ask (네트워크 없이 확인)
      - name: Hook wrapper contract
        run: |
          ./gradlew :gate-pkg:cliJar --no-daemon -q
          in='{"tool_name":"Bash","tool_input":{"command":"git status"}}'
          out=$(printf '%s' "$in" | sh gate-pkg/bin/gate-pkg-hook); test -z "$out"
          in='{"tool_name":"Bash","tool_input":{"command":"npm install lodash"}}'
          out=$(printf '%s' "$in" | GATE_PKG_JAR=/nonexistent.jar sh gate-pkg/bin/gate-pkg-hook)
          echo "$out" | grep -q '"permissionDecision":"ask"'
          in='{"tool_name":"Bash","tool_input":{"command":"npm ci"}}'
          out=$(printf '%s' "$in" | sh gate-pkg/bin/gate-pkg-hook)
          echo "$out"; echo "$out" | grep -q '"permissionDecision":"ask"'

      # 러너에는 Docker가 있으므로 통합 테스트가 건너뛰어지면 안 된다
      - name: Ensure integration tests actually ran
        run: |
          found=0
          for f in gate-server/build/test-results/test/TEST-*IT.xml; do
            found=1
            grep -o '<testsuite [^>]*>' "$f"
            grep -q 'skipped="0"' "$f" || { echo "$f was skipped"; exit 1; }
          done
          test "$found" = 1 || { echo "no integration test results"; exit 1; }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  live:
    name: Live registry check (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Live tests against real registries
        run: ./gradlew :gate-pkg:liveTest --no-daemon

  action-demo:
    name: gate-pkg Action demo (typosquat PR is blocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 임시 저장소: base에는 lodash만, head에서 lodahs(철자 흉내)를 추가한다
      - name: Create a demo repository that adds a typosquat
        id: demo
        run: |
          demo="$RUNNER_TEMP/demo"
          mkdir -p "$demo" && cd "$demo"
          git init -q
          git config user.name demo && git config user.email demo@example.invalid
          echo '{"dependencies":{"lodash":"4.17.21"}}' > package.json
          git add . && git commit -qm base && git tag base
          printf '{"dependencies":{\n  "lodash":"4.17.21",\n  "lodahs":"^4.17.21"\n}}\n' > package.json
          git commit -qam "add lodahs"
          echo "dir=$demo" >> "$GITHUB_OUTPUT"

      - name: Run the gate-pkg Action (expected to fail)
        id: gate
        continue-on-error: true
        uses: ./.github/actions/gate-pkg
        with:
          base: base
          working-directory: ${{ steps.demo.outputs.dir }}

      - name: The Action must have blocked the change
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = failure && test "$CODE" = 2

  compose-smoke:
    name: Stage 0 check - docker compose health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^GATE_DB_PASSWORD=.*/GATE_DB_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: docker compose up (wait for healthy)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health check
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/actuator/health)
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
          echo "$body" | grep -q '"db":{"status":"UP"'
          echo "$body" | grep -q '"redis":{"status":"UP"'

      - name: Schema created by Flyway
        run: |
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT table_name FROM information_schema.tables WHERE table_schema = '"'"'public'"'"' ORDER BY 1"' | tee tables.txt
          grep -qx scan_run tables.txt
          grep -qx finding tables.txt

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
