# GATE CI: 빌드·테스트 + 0단계 완료 기준(docker compose 헬스체크) 검증
# 모든 Action은 커밋 SHA로 고정한다 (태그는 주석으로 표기).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 매주 월요일: 실제 레지스트리 응답 형식이 녹화본과 어긋나지 않았는지 확인 (live 테스트)
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (incl. Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # gate-review: 고정 버전 Semgrep을 가상 환경에 설치하고 규칙 테스트부터 돌린다
      - name: Semgrep (pinned) and rule tests
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install -q -r gate-review/semgrep/requirements.txt
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version
          "$RUNNER_TEMP/semgrep/bin/semgrep" --test --metrics=off --disable-version-check gate-review/semgrep/rules
          echo "GATE_SEMGREP=$RUNNER_TEMP/semgrep/bin/semgrep" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build --no-daemon

      # gate-review PR 댓글 스크립트: AI가 쓴 글의 멘션·HTML이 무력화되는지 (네트워크 없이)
      - name: gate-review comment script contract
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "gate-review/bin")
          import pr_review as p
          f = {"decision": "WARN", "source": "AI", "severity": "HIGH", "title": "@admin <img src=x>", "file": "a",
               "line": 1, "evidence": {"model": "m", "cwe": "CWE-639", "evidence": "ping @team",
                                       "quotedCode": "List<String> x;", "confidence": "high"}}
          body = p.finding_body(f)
          assert "@​admin" in body and "@​team" in body, body
          assert "<img" not in body, body
          assert "`List<String> x;`" in body.replace("` ", "`").replace(" `", "`"), body
          assert "never blocks on AI judgement alone" in body, body
          s = p.summary({"decision": "WARN", "staticEngine": "semgrep", "ai": {"status": "SKIPPED", "detail": "no key"},
                         "findings": [f], "rejectedAiFindings": [], "staticErrors": []}, [], [f])
          assert "not used (SKIPPED" in s and "outside the changed lines" in s, s
          print("ok")
          PY

      # 실패한 테스트 메시지를 Actions 주석(annotation)으로 남겨 PR·실행 화면에서 바로 보이게 한다
      - name: Report test failures as annotations
        if: failure()
        run: |
          for f in $(grep -l -E '<(failure|error)' */build/test-results/test/*.xml 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for tag in ("failure", "error"):
                  for el in case.findall(tag):
                      body = el.text or ""
                      causes = [l.strip() for l in body.splitlines() if l.strip().startswith("Caused by")]
                      text = ((el.get("message") or "")[:1500] + "\n" + "\n".join(causes[-4:]))[:3500]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
          done

      # 훅 래퍼 계약: 설치가 아닌 명령은 출력 없음, jar가 없으면 통과가 아니라 ask (네트워크 없이 확인)
      - name: Hook wrapper contract
        run: |
          ./gradlew :gate-pkg:cliJar --no-daemon -q
          in='{"tool_name":"Bash","tool_input":{"command":"git status"}}'
          out=$(printf '%s' "$in" | sh gate-pkg/bin/gate-pkg-hook); test -z "$out"
          in='{"tool_name":"Bash","tool_input":{"command":"npm install lodash"}}'
          out=$(printf '%s' "$in" | GATE_PKG_JAR=/nonexistent.jar sh gate-pkg/bin/gate-pkg-hook)
          echo "$out" | grep -q '"permissionDecision":"ask"'
          in='{"tool_name":"Bash","tool_input":{"command":"npm ci"}}'
          out=$(printf '%s' "$in" | sh gate-pkg/bin/gate-pkg-hook)
          echo "$out"; echo "$out" | grep -q '"permissionDecision":"ask"'

      # 러너에는 Docker가 있으므로 통합 테스트가 건너뛰어지면 안 된다
      - name: Ensure integration tests actually ran
        run: |
          found=0
          for f in gate-server/build/test-results/test/TEST-*IT.xml; do
            found=1
            grep -o '<testsuite [^>]*>' "$f"
            grep -q 'skipped="0"' "$f" || { echo "$f was skipped"; exit 1; }
          done
          test "$found" = 1 || { echo "no integration test results"; exit 1; }
          for f in gate-review/build/test-results/test/TEST-io.gate.review.staticscan.SemgrepRealIT.xml \
                   gate-review/build/test-results/test/TEST-io.gate.review.cli.ReviewCliIT.xml \
                   gate-review/build/test-results/test/TEST-io.gate.review.cli.MeasureIT.xml; do
            grep -o '<testsuite [^>]*>' "$f"
            grep -q 'skipped="0"' "$f" || { echo "$f was skipped"; exit 1; }
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  live:
    name: Live registry check (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Live tests against real registries
        run: ./gradlew :gate-pkg:liveTest --no-daemon

  action-demo:
    name: gate-pkg Action demo (typosquat PR is blocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 임시 저장소: base에는 lodash만, head에서 lodahs(철자 흉내)를 추가한다
      - name: Create a demo repository that adds a typosquat
        id: demo
        run: |
          demo="$RUNNER_TEMP/demo"
          mkdir -p "$demo" && cd "$demo"
          git init -q
          git config user.name demo && git config user.email demo@example.invalid
          echo '{"dependencies":{"lodash":"4.17.21"}}' > package.json
          git add . && git commit -qm base && git tag base
          printf '{"dependencies":{\n  "lodash":"4.17.21",\n  "lodahs":"^4.17.21"\n}}\n' > package.json
          git commit -qam "add lodahs"
          echo "dir=$demo" >> "$GITHUB_OUTPUT"

      - name: Run the gate-pkg Action (expected to fail)
        id: gate
        continue-on-error: true
        uses: ./.github/actions/gate-pkg
        with:
          base: base
          working-directory: ${{ steps.demo.outputs.dir }}

      - name: The Action must have blocked the change
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = failure && test "$CODE" = 2

  compose-smoke:
    name: Stage 0 check - docker compose health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^GATE_DB_PASSWORD=.*/GATE_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          # 실습장 데모 비밀번호도 이번 실행에서만 쓰는 무작위 값 (gate-authz가 로그인에 사용)
          pw=$(openssl rand -hex 12)
          echo "::add-mask::$pw"
          sed -i "s/^GATE_LAB_DEMO_PASSWORD=.*/GATE_LAB_DEMO_PASSWORD=$pw/" .env

      - name: docker compose up (wait for healthy)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health check
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/actuator/health)
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
          echo "$body" | grep -q '"db":{"status":"UP"'
          echo "$body" | grep -q '"redis":{"status":"UP"'

      # 대시보드: gate-server가 같은 주소에서 화면을 제공하고, 보안 헤더(인라인 스크립트 금지 CSP)를 붙인다
      - name: Dashboard is served by gate-server with a strict CSP
        run: |
          curl -fsS -D /tmp/h.txt http://127.0.0.1:8080/ -o /tmp/index.html
          grep -q '<div id="root">' /tmp/index.html
          grep -qi "^content-security-policy:.*script-src 'self';" /tmp/h.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/h.txt
          ! grep -q '<script>' /tmp/index.html
          js=$(grep -o '/assets/[^"]*\.js' /tmp/index.html | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080$js"
          curl -fsS http://127.0.0.1:8080/api/summary | tee /tmp/summary.json
          test "$(jq '.modules | length' /tmp/summary.json)" = 4

      - name: Schema created by Flyway
        run: |
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT table_name FROM information_schema.tables WHERE table_schema = '"'"'public'"'"' ORDER BY 1"' | tee tables.txt
          grep -qx scan_run tables.txt
          grep -qx finding tables.txt

      # gate-lab: 컨테이너로 잠깐 띄워 같은 공격이 vulnerable에서는 통하고 fixed에서는 막히는지 확인한 뒤 내린다
      - name: gate-lab containers (local-only practice app)
        run: docker compose --profile lab up -d --build --wait --wait-timeout 300 lab-vulnerable lab-fixed

      - name: gate-lab forged token works only on the vulnerable variant
        run: |
          b64() { printf '%s' "$1" | base64 -w0 | tr '+/' '-_' | tr -d '='; }
          forged="$(b64 '{"alg":"none"}').$(b64 '{"sub":"bob"}')."
          v=$(curl -s -o /tmp/v.json -w '%{http_code}' -H "Authorization: Bearer $forged" http://127.0.0.1:8081/api/me)
          f=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $forged" http://127.0.0.1:8082/api/me)
          echo "vulnerable=$v $(cat /tmp/v.json)  fixed=$f"
          test "$v" = 200 && grep -q '"username":"bob"' /tmp/v.json && test "$f" = 401

      - name: gate-lab is published on 127.0.0.1 only
        run: |
          docker compose --profile lab port lab-vulnerable 8081 | tee /tmp/port.txt
          grep -q '^127.0.0.1:8081$' /tmp/port.txt

      # 3단계 완료 기준: gate-authz가 실제 네트워크로 실습장을 검사하고, 결과를 gate-server에 저장한다
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: gate-authz finds IDOR on the vulnerable lab and stores results in gate-server
        run: |
          ./gradlew :gate-authz:cliJar --no-daemon -q
          pw=$(grep '^GATE_LAB_DEMO_PASSWORD=' .env | cut -d= -f2)
          export GATE_AUTHZ_PASSWORD_A="$pw" GATE_AUTHZ_PASSWORD_B="$pw"
          set +e
          GATE_SERVER_URL=http://127.0.0.1:8080 java -jar gate-authz/build/libs/gate-authz.jar \
            scan --config gate-authz/gate-authz.lab.yml --format json > /tmp/authz-vulnerable.json
          code=$?
          set -e
          jq '{decision, findings: [.findings[] | {ruleId, location}], coverage}' /tmp/authz-vulnerable.json
          test "$code" = 2
          rules=$(jq -r '[.findings[].ruleId] | sort | join(",")' /tmp/authz-vulnerable.json)
          test "$rules" = "AUTHZ-BOLA-DELETE,AUTHZ-BOLA-READ,AUTHZ-BOLA-WRITE"

      - name: gate-authz finds nothing on the fixed lab
        run: |
          pw=$(grep '^GATE_LAB_DEMO_PASSWORD=' .env | cut -d= -f2)
          export GATE_AUTHZ_PASSWORD_A="$pw" GATE_AUTHZ_PASSWORD_B="$pw"
          sed 's/127.0.0.1:8081/127.0.0.1:8082/g' gate-authz/gate-authz.lab.yml > /tmp/gate-authz.fixed.yml
          java -jar gate-authz/build/libs/gate-authz.jar scan --config /tmp/gate-authz.fixed.yml --format json \
            > /tmp/authz-fixed.json
          jq '{decision, findings: (.findings | length), coverage}' /tmp/authz-fixed.json
          test "$(jq '.findings | length' /tmp/authz-fixed.json)" = 0

      - name: gate-authz findings are stored in PostgreSQL
        run: |
          echo "SELECT r.module, f.rule_id, f.location->>'method', f.location->>'path' FROM finding f JOIN scan_run r ON r.id = f.run_id WHERE r.module = 'AUTHZ' ORDER BY f.rule_id;" \
            | docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tee /tmp/stored.txt
          test "$(grep -c '^AUTHZ|AUTHZ-BOLA-' /tmp/stored.txt)" = 3

      # 5단계 완료 기준: 공격 사례 묶음을 막고 결과를 수치로 남긴다. 출력 관문을 통과한 공격이 있으면 실패(종료 코드 1)
      - name: gate-prompt measurement stops every attack and stores results in gate-server
        run: |
          ./gradlew :gate-prompt:cliJar --no-daemon -q
          GATE_SERVER_URL=http://127.0.0.1:8080 java -jar gate-prompt/build/libs/gate-prompt.jar measure \
            --out /tmp/prompt.json | tee /tmp/prompt.txt
          grep -q 'reported to http://127.0.0.1:8080' /tmp/prompt.txt
          jq '.summary' /tmp/prompt.json
          test "$(jq '.summary.OUTPUT_ONLY.attacksStopped' /tmp/prompt.json)" = "$(jq '.summary.OUTPUT_ONLY.attacks' /tmp/prompt.json)"
          echo "SELECT f.decision, count(*) FROM finding f JOIN scan_run r ON r.id = f.run_id WHERE r.module = 'PROMPT' GROUP BY f.decision ORDER BY 1;" \
            | docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tee /tmp/prompt-stored.txt
          grep -q '^BLOCK|' /tmp/prompt-stored.txt
          grep -q '^WARN|' /tmp/prompt-stored.txt

      - name: Logs on failure
        if: failure()
        run: docker compose --profile lab logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile lab down -v
