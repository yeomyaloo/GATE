# Dependabot: 이미 들어와 있는 라이브러리를 계속 다시 확인한다 (GATE gate-pkg는 "새로 들어오는 순간"을 막는다).
# - 이 저장소 원칙대로, 공개된 지 14일이 지난 버전만 제안한다 (cooldown). 급한 보안 수정은 Dependabot 보안 업데이트가 따로 연다
# - 같은 생태계의 변경은 한 PR로 묶어 소음을 줄인다
# - 제안 PR도 GATE 검사를 거친다: package.json이 바뀌면 gate-pkg 워크플로가 새 버전을 검사한다
version: 2
updates:
  # Java (Gradle: 버전 카탈로그 gradle/libs.versions.toml과 각 모듈 build.gradle.kts)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: ["*"]

  # 대시보드 (npm). .npmrc의 HTTPS 레지스트리·설치 스크립트 안 함 설정은 그대로 쓴다
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  # Semgrep(gate-review/semgrep/requirements.txt)은 넣지 않는다: 버전이 코드(SemgrepRunner.PINNED_VERSION)와
  # 녹화된 결과(fixtures)에 함께 고정돼 있어, 요구사항 파일만 바꾸면 CI가 실패한다. 올릴 때는 손으로 함께 바꾼다

  # GitHub Actions (커밋 SHA 고정은 그대로 두고 SHA와 버전 주석을 함께 올린다). 복합 Action도 포함
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/gate-pkg"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # 컨테이너 기본 이미지 (태그 + digest 고정)
  - package-ecosystem: docker
    directories: ["/gate-server", "/gate-lab"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Java 기본 이미지는 손으로 올린다. 태그(17.0.21_9-jdk-alpine-3.24)를 Dependabot이 제대로 읽지 못해
      # 주 버전 변경(17→24)과 Alpine 내리기(3.24→3.21)를 제안했다(2026-11-22, PR #2·#4·#9·#10).
      # 이 프로젝트는 Java 17(LTS)로 고정하고, 태그 + digest를 함께 바꾼다
      - dependency-name: "eclipse-temurin"
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
