# 비밀값은 여기에 쓰지 않는다. 모두 환경 변수(.env → docker compose)로 주입한다.
spring:
  application:
    name: gate-server
  datasource:
    url: ${GATE_DB_URL:jdbc:postgresql://localhost:5432/gate}
    username: ${GATE_DB_USER:gate}
    password: ${GATE_DB_PASSWORD:}
  data:
    redis:
      host: ${GATE_REDIS_HOST:localhost}
      port: ${GATE_REDIS_PORT:6379}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
